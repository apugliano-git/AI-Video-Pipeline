services:
  redis:
    image: redis:7-alpine
    container_name: clipper-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Celery worker — run after installing Python deps locally
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: clipper-worker
    env_file:
      - ../.env
    volumes:
      - ../storage:/app/storage
      - ../app:/app/app
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1
    restart: unless-stopped
    profiles:
      - full

volumes:
  redis_data:
